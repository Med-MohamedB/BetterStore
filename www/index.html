<!-- Boot Gate: first-launch-only overlay. Hidden by default so returning
     users (flag already set in localStorage) never see any flash. -->
<div id="bootGate">
  <div class="boot-card" id="bootCard">
    <div class="boot-icon pulse" id="bootIcon">📡</div>
    <div class="boot-title" id="bootTitle">Connect to the internet</div>
    <div class="boot-text" id="bootText">
      First time opening Store App — it needs one quick connection to set
      itself up for offline use. After this, it will never ask again.
    </div>
    <button class="boot-btn" id="bootRetryBtn" style="display:none;">Retry</button>
    <div class="boot-spinner" id="bootSpinner" style="display:none;"></div>
    <div class="boot-status" id="bootStatus"></div>
  </div>
</div>
<script>
(function () {
  var FLAG = 'sa_boot_complete';
  if (localStorage.getItem(FLAG)) return; // already set up — do nothing, ever

  var gate = document.getElementById('bootGate');
  var icon = document.getElementById('bootIcon');
  var title = document.getElementById('bootTitle');
  var text = document.getElementById('bootText');
  var btn = document.getElementById('bootRetryBtn');
  var spinner = document.getElementById('bootSpinner');
  var status = document.getElementById('bootStatus');

  function showOfflineState() {
    gate.classList.add('show');
    icon.textContent = '📡';
    title.textContent = 'Connect to the internet';
    text.textContent = 'First time opening Store App — it needs one quick connection to set itself up for offline use. After this, it will never ask again.';
    btn.style.display = 'block';
    spinner.style.display = 'none';
    status.textContent = '';
  }

  function showSettingUpState() {
    gate.classList.add('show');
    icon.textContent = '✨';
    title.textContent = 'Setting up offline mode';
    text.textContent = 'Just a moment — Store App is caching everything it needs so it will work with zero internet from now on.';
    btn.style.display = 'none';
    spinner.style.display = 'block';
    status.textContent = '';
  }

  function finish() {
    localStorage.setItem(FLAG, '1');
    gate.classList.remove('show');
  }

  function runSetup() {
    showSettingUpState();
    if (!('serviceWorker' in navigator)) {
      // No SW support (rare) — nothing more we can do, just let them in.
      finish();
      return;
    }
    var timedOut = false;
    var timeout = setTimeout(function () {
      timedOut = true;
      status.textContent = 'Taking longer than usual… you can keep waiting.';
    }, 8000);
    var giveUp = setTimeout(function () {
      // Safety net: don't trap the user forever on a flaky connection.
      finish();
    }, 25000);

    navigator.serviceWorker.register('./service-worker.js')
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function () {
        clearTimeout(timeout);
        clearTimeout(giveUp);
        finish();
      })
      .catch(function () {
        clearTimeout(timeout);
        clearTimeout(giveUp);
        // Registration failed outright — let them use the app online-only
        // this session rather than blocking them completely.
        finish();
      });
  }

  function attempt() {
    if (navigator.onLine) {
      runSetup();
    } else {
      showOfflineState();
    }
  }

  btn.addEventListener('click', attempt);
  window.addEventListener('online', function () {
    if (gate.classList.contains('show') && spinner.style.display === 'none') {
      attempt(); // auto-retry the moment connection comes back
    }
  });

  attempt();
})();
</script>

<div id="app">

  <header class="topbar">
    <div class="topbar__title" id="topbarTitle">
      Dashboard
      <small id="topbarSubtitle">&nbsp;</small>
    </div>
    <div class="topbar__actions" id="topbarActions"></div>
  </header>

  <main id="view">
    <div class="view-loading"><div class="spinner"></div></div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <span class="nav-indicator" id="navIndicator"></span>
    <button class="nav-item" data-route="dashboard">
      <span class="nav-item__icon">🏠</span><span>Dashboard</span>
    </button>
    <button class="nav-item" data-route="products">
      <span class="nav-item__icon">📦</span><span>Products</span>
    </button>
    <button class="nav-item nav-item--fab" data-route="pos">
      <span class="nav-item__icon">🧾<span class="nav-badge" id="cartBadge"></span></span><span>POS</span>
    </button>
    <button class="nav-item" data-route="sales">
      <span class="nav-item__icon">🧮</span><span>Sales</span>
    </button>
    <button class="nav-item" data-route="more">
      <span class="nav-item__icon">☰</span><span>More</span>
    </button>
  </nav>

</div>

<!-- Always-present print target — a plain body-level block, deliberately
     outside #app's fixed/transformed containers, so printed receipts flow
     naturally across pages instead of inheriting a Sheet's positioning. -->
