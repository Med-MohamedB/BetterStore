<!-- Service-worker cleanup: this app is a Capacitor-bundled native build,
     which already ships every file inside the APK — it doesn't need a
     service worker for offline support at all, and Capacitor's own team
     flags SW+Android-WebView as unreliable in practice. An earlier version
     of this app registered one anyway, which caused a real bug: after an
     app update, the OLD service worker could keep serving its OLD cached
     copies of app.js/index.html/etc. indefinitely, making new features
     silently never show up until someone cleared all app data (which also
     wiped their real business data). This unregisters any such leftover
     service worker and clears its caches, unconditionally, every launch —
     cheap and a no-op once nothing is left to clean up. -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistrations()
    .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
    .catch(function () {});
  if ('caches' in window) {
    caches.keys()
      .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
      .catch(function () {});
  }
})();
</script>
