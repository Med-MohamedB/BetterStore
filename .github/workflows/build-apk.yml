name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the GitHub Release below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor (regenerates android/app/src/main/assets/public, cordova plugin glue, capacitor.config.json)
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (workflow artifact — for browsing individual CI runs)
        uses: actions/upload-artifact@v4
        with:
          name: store-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # A workflow artifact needs GitHub auth to download, so it isn't
      # something the app itself (or any end user's device) can fetch. A
      # GitHub Release asset, on the other hand, is a stable, public URL
      # with no auth needed — that's what the in-app forced-update flow
      # and the panel's Update tab both actually download from.
      - name: Read app version
        id: appver
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.appver.outputs.version }}"
          # Re-running a build at the same app version (e.g. iterating on
          # a fix before bumping) would otherwise fail the second time
          # with "release already exists" — replace it instead.
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Better Store $TAG" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --repo "${{ github.repository }}"
